syntax = "proto3";

package tanwei.protocol.v1;

option java_multiple_files = true;
option java_package = "dev.tanwei.protocol.v1";
option java_outer_classname = "TanweiProtocol";

service DiagnosticService {
  rpc GetCapabilities(CapabilitiesRequest) returns (CapabilitiesResponse);
  rpc GetSnapshot(SnapshotRequest) returns (RuntimeSnapshot);
  rpc StreamMetrics(MetricStreamRequest) returns (stream RuntimeSnapshot);
  rpc ListThreads(ThreadListRequest) returns (ThreadListResponse);
  rpc ListClasses(ClassListRequest) returns (ClassListResponse);
  rpc GetClassDetails(ClassDetailsRequest) returns (ClassDetailsResponse);
  rpc ExecuteAction(ActionRequest) returns (ActionResponse);
  rpc DownloadArtifact(ArtifactDownloadRequest) returns (stream ArtifactChunk);
  rpc DeleteArtifact(RemoteArtifactRequest) returns (RemoteArtifactResponse);
  rpc GetObservationEvents(ObservationEventsRequest) returns (ObservationEventsResponse);
  rpc CancelObservation(ObservationTaskRequest) returns (ObservationTaskResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

message RequestContext {
  string request_id = 1;
  string task_id = 2;
  int64 timestamp_epoch_millis = 3;
}

message CapabilitiesRequest {
  RequestContext context = 1;
  string client_protocol_version = 2;
}

message Capability {
  string id = 1;
  string state = 2;
  string reason = 3;
}

message CapabilitiesResponse {
  string protocol_version = 1;
  string agent_version = 2;
  int64 process_id = 3;
  string java_version = 4;
  repeated Capability capabilities = 5;
}

message SnapshotRequest {
  RequestContext context = 1;
}

message MetricStreamRequest {
  RequestContext context = 1;
  int64 interval_millis = 2;
  int32 max_events = 3;
}

message RuntimeSnapshot {
  int64 sequence = 1;
  int64 captured_at_epoch_millis = 2;
  int64 uptime_millis = 3;
  double process_cpu_load = 4;
  bool has_process_cpu_load = 5;
  double system_cpu_load = 6;
  bool has_system_cpu_load = 7;
  int64 heap_used_bytes = 8;
  int64 heap_max_bytes = 9;
  int64 non_heap_used_bytes = 10;
  int32 live_threads = 11;
  int32 peak_threads = 12;
  int32 loaded_classes = 13;
  int64 gc_count = 14;
  int64 gc_time_millis = 15;
  int64 jvm_start_time_epoch_millis = 16;
}

message ThreadListRequest {
  RequestContext context = 1;
  int32 offset = 2;
  int32 limit = 3;
  int32 stack_depth = 4;
  string name_query = 5;
  string state_filter = 6;
}

message ThreadDescriptor {
  int64 id = 1;
  string name = 2;
  string state = 3;
  bool daemon = 4;
  int32 priority = 5;
  int64 cpu_time_nanos = 6;
  bool has_cpu_time = 7;
  repeated string stack = 8;
  bool deadlocked = 9;
  string lock_name = 10;
  int64 lock_owner_id = 11;
}

message ThreadListResponse {
  int32 total = 1;
  int32 offset = 2;
  repeated ThreadDescriptor threads = 3;
}

message ClassListRequest {
  RequestContext context = 1;
  int32 offset = 2;
  int32 limit = 3;
  string name_query = 4;
}

message ClassDescriptor {
  string name = 1;
  string class_loader = 2;
  string module = 3;
  bool modifiable = 4;
}

message ClassListResponse {
  int32 total_matches = 1;
  int32 offset = 2;
  repeated ClassDescriptor classes = 3;
}

message ClassDetailsRequest {
  RequestContext context = 1;
  string name = 2;
  string class_loader = 3;
}

message MethodDescriptor {
  string name = 1;
  string return_type = 2;
  repeated string parameter_types = 3;
  repeated string exception_types = 4;
  string modifiers = 5;
  repeated string annotations = 6;
}

message ClassDetailsResponse {
  bool found = 1;
  string error_code = 2;
  string name = 3;
  string class_loader = 4;
  string code_source = 5;
  string modifiers = 6;
  string super_class = 7;
  repeated string interfaces = 8;
  repeated string annotations = 9;
  repeated MethodDescriptor methods = 10;
}

message ActionRequest {
  RequestContext context = 1;
  string action_id = 2;
  map<string, string> parameters = 3;
}

message ActionResponse {
  string status = 1;
  string error_code = 2;
  string message = 3;
  map<string, string> values = 4;
}

message ArtifactDownloadRequest {
  RequestContext context = 1;
  string token = 2;
}

message ArtifactChunk {
  int64 sequence = 1;
  bytes data = 2;
}

message RemoteArtifactRequest {
  RequestContext context = 1;
  string token = 2;
}

message RemoteArtifactResponse {
  bool deleted = 1;
}

message ObservationEventsRequest {
  RequestContext context = 1;
  string task_id = 2;
  int32 limit = 3;
}

message ObservationEvent {
  int64 sequence = 1;
  int64 captured_at_epoch_millis = 2;
  int64 duration_nanos = 3;
  string thread_name = 4;
  repeated string arguments = 5;
  string return_value = 6;
  string exception_type = 7;
  string exception_message = 8;
  repeated string call_stack = 9;
  int64 parent_sequence = 10;
  int32 depth = 11;
  string method = 12;
  string phase = 13;
  int64 event_id = 14;
}

message ObservationEventsResponse {
  string task_id = 1;
  string state = 2;
  int32 captured = 3;
  int32 dropped = 4;
  repeated ObservationEvent events = 5;
}

message ObservationTaskRequest {
  RequestContext context = 1;
  string task_id = 2;
}

message ObservationTaskResponse {
  string task_id = 1;
  string state = 2;
}

message ShutdownRequest {
  RequestContext context = 1;
}

message ShutdownResponse {
  bool accepted = 1;
}
