name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  jdk-compatibility:
    name: JDK ${{ matrix.java }} compatibility
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 17, 21, 25]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-node@v7
        if: matrix.java != 8
        with:
          node-version: 24
      - name: Build native JVMTI component
        if: matrix.java != 8
        run: node scripts/build-native-components.mjs
      - name: Verify Java 8 compatible production modules
        if: matrix.java == 8
        run: >-
          mvn -f jvm/pom.xml
          -pl protocol,agent,bootstrap,decompiler,relay
          -am verify
      - name: Verify complete JVM reactor
        if: matrix.java != 8
        run: mvn -f jvm/pom.xml verify

  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            runner: macos-14
          - name: macOS-x64
            runner: macos-15-intel
          - name: Linux-x64
            runner: ubuntu-22.04
          - name: Windows-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Use repository npm version
        run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run test
      - run: npm run package:test
      - name: Packaged application E2E
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Packaged application E2E (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnostics-${{ matrix.name }}
          path: |
            output/
            jvm/**/target/surefire-reports/
          if-no-files-found: ignore
