name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  jdk-compatibility:
    name: JDK ${{ matrix.java }} compatibility
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 17, 21, 25]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-node@v7
        if: matrix.java == 21
        with:
          node-version: 24
      - name: Build native JVMTI component
        if: matrix.java == 21
        run: node scripts/build-native-components.mjs
      - name: Verify Java 8 compatible production modules
        if: matrix.java == 8
        run: >-
          mvn -f jvm/pom.xml
          -pl protocol,agent,bootstrap,attach-helper,decompiler,relay
          -am verify
      - name: Verify Java 11+ production modules
        if: matrix.java != 8 && matrix.java != 21
        run: >-
          mvn -f jvm/pom.xml
          -pl protocol,agent,bootstrap,attach-helper,decompiler,relay
          -am verify
      - name: Verify complete JVM reactor and Attach integration
        if: matrix.java == 21
        run: mvn -f jvm/pom.xml verify

  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            runner: macos-14
            e2e: smoke
          - name: macOS-x64
            runner: macos-15-intel
            e2e: smoke
          - name: Linux-x64
            runner: ubuntu-22.04
            e2e: full
          - name: Windows-x64
            runner: windows-2022
            e2e: smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Use repository npm version
        run: npm install --global npm@11.6.2
      - run: npm ci
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.name }}
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm run test:desktop
      - name: Build packaged Tauri test application
        env:
          MAVEN_ARGS: -ntp -DskipTests
        run: npm run package:test
      - name: Packaged application launch smoke
        if: matrix.e2e == 'smoke'
        run: npm run test:e2e -- --grep "main window"
      - name: Full packaged application E2E (Xvfb)
        if: matrix.e2e == 'full'
        run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnostics-${{ matrix.name }}
          path: |
            output/
            jvm/**/target/surefire-reports/
          if-no-files-found: ignore
