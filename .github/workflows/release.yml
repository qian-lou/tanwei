name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本，必须匹配产品版本（例如 v0.3.0）"
        required: true
        default: v0.3.0
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TANWEI_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate version and immutable tag
        id: version
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from "node:child_process";
          import { readFileSync, appendFileSync } from "node:fs";
          const tag = process.env.TANWEI_RELEASE_TAG;
          const version = JSON.parse(readFileSync("package.json", "utf8")).version;
          if (!/^v\d+\.\d+\.\d+$/u.test(tag) || tag !== `v${version}`) throw new Error("发布标签必须与产品版本一致");
          const revision = execFileSync("git", ["rev-parse", "HEAD"], {encoding:"utf8"}).trim();
          const refs = execFileSync("git", ["ls-remote", "--tags", "origin", `refs/tags/${tag}`, `refs/tags/${tag}^{}`], {encoding:"utf8"}).trim();
          if (refs) {
            const entries = refs.split("\n").map(line => line.split(/\s+/u));
            const commit = entries.find(entry => entry[1].endsWith("^{}"))?.[0] ?? entries[0][0];
            if (commit !== revision) throw new Error("发布标签已存在且指向其他提交，拒绝覆盖");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `revision=${revision}\n`);
          JS

  package:
    name: Package ${{ matrix.name }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            runner: macos-14
            e2e: smoke
          - name: macOS-x64
            runner: macos-15-intel
            e2e: smoke
          - name: Linux-x64
            runner: ubuntu-22.04
            e2e: full
          - name: Windows-x64
            runner: windows-2022
            e2e: smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.name }}
          cache-on-failure: true
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev xvfb
      - name: Use repository npm version
        run: npm install --global npm@11.6.2
      - run: npm ci
      - name: Require updater keys and fixed macOS certificate
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TANWEI_UPDATER_PUBLIC_KEY: ${{ secrets.TANWEI_UPDATER_PUBLIC_KEY }}
          MACOS_CERTIFICATE: ${{ startsWith(matrix.name, 'macOS-') && secrets.MACOS_CERTIFICATE || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ startsWith(matrix.name, 'macOS-') && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          MACOS_CERTIFICATE_SHA256: ${{ startsWith(matrix.name, 'macOS-') && secrets.MACOS_CERTIFICATE_SHA256 || '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          test -n "$TANWEI_UPDATER_PUBLIC_KEY"
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -n "$MACOS_CERTIFICATE"
            test -n "$MACOS_CERTIFICATE_PASSWORD"
            test -n "$MACOS_CERTIFICATE_SHA256"
          fi
      - run: npm run test:desktop
      - name: Verify JVM integration
        if: runner.os == 'Linux'
        run: npm run test:jvm
      - name: Build Tauri WebDriver test package
        env:
          MAVEN_ARGS: -ntp -DskipTests
        run: npm run package:test
      - name: Packaged test application launch smoke
        if: matrix.e2e == 'smoke'
        run: npm run test:e2e -- --grep "main window"
      - name: Full packaged test application E2E (Xvfb)
        if: matrix.e2e == 'full'
        run: xvfb-run -a npm run test:e2e
      - name: Build production release without WebDriver
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TANWEI_UPDATER_PUBLIC_KEY: ${{ secrets.TANWEI_UPDATER_PUBLIC_KEY }}
          MACOS_CERTIFICATE: ${{ startsWith(matrix.name, 'macOS-') && secrets.MACOS_CERTIFICATE || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ startsWith(matrix.name, 'macOS-') && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          MACOS_CERTIFICATE_SHA256: ${{ startsWith(matrix.name, 'macOS-') && secrets.MACOS_CERTIFICATE_SHA256 || '' }}
          MAVEN_ARGS: -ntp -DskipTests
        run: npm run package:release
      - name: Production application startup
        if: runner.os != 'Linux'
        run: node scripts/release-smoke.mjs
      - name: Production AppImage startup (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/release-smoke.mjs
      - name: Verify Debian package metadata
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for artifact in apps/desktop/release/*.deb; do
            dpkg-deb --info "$artifact"
            test "$(dpkg-deb --field "$artifact" Package)" = "tanwei"
            test "$(dpkg-deb --field "$artifact" Version)" = "${TANWEI_RELEASE_TAG#v}"
            test "$(dpkg-deb --field "$artifact" Architecture)" = "amd64"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: apps/desktop/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnostics-${{ matrix.name }}
          path: |
            output/
            jvm/**/target/surefire-reports/
          if-no-files-found: ignore

  publish:
    name: Publish four-platform release
    needs: [preflight, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Combine signed update manifests
        run: node scripts/merge-update-manifests.mjs release-assets
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish installers and updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REVISION: ${{ needs.preflight.outputs.revision }}
        run: >-
          gh release create "$TANWEI_RELEASE_TAG"
          release-assets/*
          --target "$RELEASE_REVISION"
          --notes-file RELEASE_NOTES.md
          --title "探微 $TANWEI_RELEASE_TAG"
          --latest
