[package]
name = "tanwei-desktop"
version = "0.3.0"
description = "Tanwei JVM Runtime Workbench"
edition = "2021"
rust-version = "1.90"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"

[lib]
name = "tanwei_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
desktop-e2e = ["dep:tauri-plugin-wdio-webdriver", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:gtk", "dep:windows", "dep:webview2-com"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
tonic-prost-build = "=0.14.3"
serde_json = "1"

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
tonic = { version = "=0.14.3", features = ["transport", "tls-ring"] }
tonic-prost = "=0.14.3"
prost = "=0.14.3"
rusqlite = { version = "=0.37.0", features = ["bundled", "backup"] }
russh = "=0.48.2"
russh-sftp = "=2.3.0"
kube = { version = "0.98", default-features = false, features = ["client", "config", "ws", "rustls-tls"] }
k8s-openapi = { version = "0.24", features = ["v1_30"] }
openssl = { version = "0.10", features = ["vendored"] }
ed25519-dalek = { version = "2.2", features = ["pkcs8", "pem", "rand_core"] }
rand = "0.8"
async-trait = "0.1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
libc = "0.2"
fs2 = "0.4"
notify-rust = "=4.18.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", optional = true }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSResponder", "NSWindow"], optional = true }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSGeometry", "NSProcessInfo", "NSString"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "=0.18.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
webview2-com = { version = "=0.38.2", optional = true }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
